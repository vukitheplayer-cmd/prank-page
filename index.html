<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bezbednosno upozorenje</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #030303;
    color: #00ff66;
    font-family: monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: #080808;
    border: 2px solid #00ff66;
    border-radius: 10px;
    padding: 25px 20px;
    box-shadow: 0 0 30px rgba(0,255,102,.4);
}

.warning {
    text-align: center;
    color: #ff2222;
    font-size: 22px;
    font-weight: bold;
    animation: blink .7s infinite;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin: 15px 0 25px;
}

.status {
    margin: 15px 0;
    font-size: 14px;
}

.ok {
    color: #00ff66;
}

.alert {
    color: #ff2222;
}

.progress-box {
    height: 24px;
    border: 1px solid #00ff66;
    margin-top: 25px;
    padding: 2px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #00ff66;
}

.percent {
    text-align: center;
    margin-top: 8px;
}

.tap {
    text-align: center;
    color: white;
    margin-top: 25px;
    animation: blink 1s infinite;
}

.final {
    text-align: center;
    color: white;
}

.final h2 {
    color: #00ff66;
}

@keyframes blink {
    50% {
        opacity: .3;
    }
}
</style>
</head>

<body>

<div class="container" id="screen">

    <div class="warning">
        ⚠ BEZBEDNOSNO UPOZORENJE ⚠
    </div>

    <div class="subtitle">
        Pokrenuta je bezbednosna provera uređaja...
    </div>

    <div class="status ok">[✓] Provera sistema</div>
    <div class="status ok">[✓] Provera memorije</div>
    <div class="status ok">[✓] Provera aplikacija</div>

    <div class="status alert" id="alert">
        [!] Provera nepoznatih aktivnosti...
    </div>

    <div class="progress-box">
        <div class="progress" id="progress"></div>
    </div>

    <div class="percent" id="percent">0%</div>

    <div class="tap">
        DODIRNI EKRAN ZA NASTAVAK
    </div>

</div>

<script>
let started = false;
let progress = 0;
let audioContext;
let oscillator;
let soundTimer;

function startPrank() {
    if (started) return;

    started = true;

    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
    }

    if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200, 100, 400]);
    }

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sawtooth";
    oscillator.frequency.value = 180;
    gain.gain.value = 0.06;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();

    let direction = 1;

    soundTimer = setInterval(() => {
        let frequency = oscillator.frequency.value;

        if (frequency >= 650) direction = -1;
        if (frequency <= 180) direction = 1;

        oscillator.frequency.value += direction * 30;
    }, 80);

    document.querySelector(".tap").style.display = "none";

    runScan();
}

function runScan() {
    const progressBar = document.getElementById("progress");
    const percent = document.getElementById("percent");
    const alertText = document.getElementById("alert");

    const timer = setInterval(() => {
        progress += Math.floor(Math.random() * 4) + 1;

        if (progress >= 100) {
            progress = 100;
            clearInterval(timer);

            if (oscillator) {
                oscillator.stop();
            }

            clearInterval(soundTimer);

            alertText.textContent = "[✓] Provera završena";
            alertText.className = "status ok";

            setTimeout(() => {
                document.getElementById("screen").innerHTML = `
                    <div class="final">
                        <h2>😂 ŠALA!</h2>
                        <p>Nema nikakvog virusa.</p>
                        <p>Ovo je bila samo bezazlena šala.</p>
                        <p style="color:#777">
                            Telefon nije skeniran niti je bilo šta promenjeno.
                        </p>
                    </div>
                `;
            }, 1500);
        }

        progressBar.style.width = progress + "%";
        percent.textContent = progress + "%";
    }, 350);
}

document.body.addEventListener("click", startPrank);
document.body.addEventListener("touchstart", startPrank);
</script>

</body>
</html>
